<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eleições 2026</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/frame.css">
</head>
<body class="frame frame-br">
  <header class="frame-barra">
    <p class="marca">Divulgação</p>
    <div class="filtros">
      <label hidden>
        Fase
        <select id="fase">
          <option value="simulado">Simulado</option>
          <option value="oficial">Oficial</option>
        </select>
      </label>
      <label>
        Eleição
        <select id="eleicao"></select>
      </label>
      <label>
        Cargo
        <select id="cargo"></select>
      </label>
      <label id="uf-campo" hidden>
        UF
        <select id="uf"></select>
      </label>
      <label id="municipio-campo" hidden>
        Município
        <select id="municipio"></select>
      </label>
    </div>
  </header>

  <section id="urnas-apuradas" class="urnas" hidden>
    <div class="urnas-cabeca">
      <p class="urnas-rotulo">Urnas apuradas<span data-lugar></span></p>
      <p class="urnas-numeros">
        <b data-qtd>0</b>
        <span data-total>de 0</span>
        <b data-pct class="urnas-pct">0%</b>
      </p>
    </div>
    <div class="urnas-trilho" role="progressbar" aria-label="Urnas apuradas" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span data-barra class="urnas-barra"></span>
    </div>
  </section>

  <main>
    <aside id="confirma-filtro" class="confirma-filtro" hidden role="status" aria-live="polite">
      <span class="confirma-marca" aria-hidden="true"></span>
      <div>
        <p class="confirma-titulo">Confira o filtro</p>
        <p class="confirma-texto" data-resumo></p>
        <p class="confirma-dica" data-dica></p>
      </div>
    </aside>
    <p id="aviso" class="aviso" hidden></p>
    <div class="apuracao-layout">
      <div id="mapa-bloco" class="mapa-bloco" hidden>
        <div class="mapa-palco">
          <svg id="mapa-brasil" viewBox="0 0 1000 980" role="img" aria-label="Mapa do Brasil por unidade da federação"></svg>
          <p id="mapa-dica" class="mapa-dica" hidden></p>
        </div>
        <aside class="mapa-lado">
          <h3 id="mapa-titulo">Resultado por estado</h3>
          <p id="mapa-nota" class="resumo"></p>
          <ul id="mapa-legenda" class="legenda"></ul>
          <div id="mapa-detalhe" class="mapa-detalhe"></div>
        </aside>
      </div>
      <div class="coluna-resultado">
        <section id="resultado-resumo" class="resultado-resumo" hidden>
          <h3 id="resultado-titulo">Resultado</h3>
          <div id="resumo-votos" class="faixa-resumo"></div>
        </section>
        <div id="candidatos" class="resultados"></div>
      </div>
    </div>
  </main>

  <script src="/frame.js"></script>
</body>
</html>
