<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eleições 2026 · Distrito Federal</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/frame.css">
</head>
<body class="frame frame-df">
  <header class="frame-barra">
    <div>
      <p class="marca">Divulgação</p>
      <h1 class="frame-titulo">Distrito Federal</h1>
      <p id="eleicao-nome" class="frame-subtitulo"></p>
    </div>
    <div class="filtros">
      <label hidden>
        Fase
        <select id="fase">
          <option value="simulado">Simulado</option>
          <option value="oficial">Oficial</option>
        </select>
      </label>
      <label id="eleicao-campo" hidden>
        Eleição
        <select id="eleicao"></select>
      </label>
      <label>
        Cargo
        <select id="cargo"></select>
      </label>
    </div>
  </header>

  <main>
    <p id="aviso" class="aviso" hidden></p>
    <div class="apuracao-layout apuracao-df">
      <div id="mapa-bloco" class="mapa-bloco mapa-df">
        <div class="mapa-palco">
          <svg id="mapa-df" viewBox="0 0 640 640" role="img" aria-label="Recorte do Brasil com o Distrito Federal ampliado"></svg>
        </div>
      </div>
      <div class="coluna-resultado">
        <section id="resultado-resumo" class="resultado-resumo" hidden>
          <h3 id="resultado-titulo">Resultado</h3>
          <div id="resumo-votos" class="faixa-resumo"></div>
        </section>
        <div id="candidatos" class="resultados"></div>
      </div>
    </div>
  </main>

  <script src="/frame-brasilia.js"></script>
</body>
</html>
